name: LaunchProof CI

on:
  pull_request:
    paths:
      - projects/launchproof/**
      - .github/workflows/launchproof-ci.yml
  push:
    branches: [main]
    paths:
      - projects/launchproof/**
      - .github/workflows/launchproof-ci.yml

permissions:
  contents: read

concurrency:
  group: launchproof-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/launchproof
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: projects/launchproof/.nvmrc
          cache: npm
          cache-dependency-path: projects/launchproof/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Verify the published base path
        env:
          PAGES_BASE_PATH: /specforge-analyst-studio/launchproof
        run: npm run build

  api:
    name: API quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/launchproof/services/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/launchproof/services/api/requirements*.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest --quiet
      - name: Build container
        run: docker build --file Dockerfile --tag launchproof-api:ci .

  terraform:
    name: Terraform quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/launchproof/infra/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without a state backend
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate
