version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(web)

  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(api)

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(infra)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(actions)
