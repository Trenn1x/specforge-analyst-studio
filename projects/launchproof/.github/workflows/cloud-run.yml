name: Deploy API to Cloud Run

on:
  workflow_dispatch:
    inputs:
      change_reason:
        description: Why is this revision being deployed?
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy API
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: gcp-production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: launchproof
      SERVICE: launchproof-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Verify API
        working-directory: services/api
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m ruff check .
          python -m pytest --quiet

      - name: Validate deployment configuration
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROJECT_ID"
          test -n "$REGION"
          test -n "$WIF_PROVIDER"
          test -n "$DEPLOYER_SERVICE_ACCOUNT"

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify Terraform provisioned the service
        run: |
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(metadata.name)' >/dev/null

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build API image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/launchproof/launchproof-api:${{ github.sha }}
        run: |
          docker build \
            --file services/api/Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE" \
            services/api
          docker push "$IMAGE"

      - name: Resolve immutable image digest
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/launchproof/launchproof-api:${{ github.sha }}
        run: |
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE" \
            --project "$PROJECT_ID" \
            --format='value(image_summary.digest)')
          test -n "$DIGEST"
          printf 'IMAGE_BY_DIGEST=%s@%s\n' "${IMAGE%:*}" "$DIGEST" >> "$GITHUB_ENV"

      - name: Update to the verified image revision
        run: |
          gcloud run services update "$SERVICE" \
            --image "$IMAGE_BY_DIGEST" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet

      - name: Record deployed revision
        env:
          CHANGE_REASON: ${{ inputs.change_reason }}
        run: |
          REVISION=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')
          printf '### Cloud Run deployment\n\n- Revision: `%s`\n- Commit: `%s`\n' \
            "$REVISION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Reason: %s\n' "$CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
